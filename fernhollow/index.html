<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move." />
    <title>Fernhollow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="valley" aria-hidden="true">
      <div class="js-canvas-container"></div>
    </div>

    <div class="ui" id="ui">
      <header class="site-header">
        <a class="logo" href="/fernhollow/" aria-label="Fernhollow home">Fernhollow</a>
        <nav aria-label="Main navigation">
          <a href="#work">Work</a>
          <a href="#about">About</a>
          <a href="#journal">Journal</a>
          <a class="pill" href="mailto:hello@fernhollow.studio">Let’s talk</a>
        </nav>
      </header>

      <main class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Grown, not built.</h1>
        <p class="caption">Rooted in nature.<br />Built for what’s next.</p>
        <a class="go" id="go" href="#work" aria-label="See our work">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12h16M14 6l6 6-6 6" />
          </svg>
        </a>
      </main>

      <div class="corner">
        <span>Scroll to wander</span>
        <i aria-hidden="true"></i>
        <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Turn ambient sound on">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z" />
            <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
            <path class="mute" d="m16 10 4 4m0-4-4 4" />
          </svg>
        </button>
      </div>
    </div>

    <div class="loader" id="loader" aria-label="Loading Fernhollow"><span></span></div>
    <script type="module" src="/src/fernhollow/main.ts"></script>
  </body>
</html>
